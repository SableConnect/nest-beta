<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Approve invite</title>
<link rel="stylesheet" href="../site.css">
<style>
:root { --blue: #3647C4; --bg: #F6F7FB; --surface: #FFFFFF; --ink: #171A3A; --muted: #565C78; --line: #E1E4F0; --warm: #FFF3EA; --warm-ink: #8A3A0C; --good: #16794A; --good-bg: #DDF3E7; color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0E1124; --surface: #171B33; --ink: #E9EBF7; --muted: #A3A9C6; --line: #2A3052; --warm: #3A2414; --warm-ink: #FFC9A3; --good: #63C98F; --good-bg: #173A2A; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0E1124; --surface: #171B33; --ink: #E9EBF7; --muted: #A3A9C6; --line: #2A3052; --warm: #3A2414; --warm-ink: #FFC9A3; --good: #63C98F; --good-bg: #173A2A; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 var(--font); }
main { max-width: 560px; margin: 0 auto; padding: 28px 16px 48px; }
h1 { font-family: var(--display); font-weight: 800; font-size: 28px; margin: 0 0 6px; letter-spacing: -0.02em; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 18px; margin-top: 16px; }
dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; margin: 0; }
dt { color: var(--muted); }
dd { margin: 0; overflow-wrap: anywhere; }
.row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
button { font: inherit; font-weight: 700; border: 0; border-radius: 16px; padding: 13px 20px; min-height: 48px; cursor: pointer; }
.yes { background: var(--blue); color: #fff; flex: 1 1 220px; }
.no { background: transparent; color: var(--muted); border: 1px solid var(--line); }
button:disabled { opacity: .5; cursor: default; }
.note { border-radius: 14px; padding: 12px 14px; margin-top: 16px; }
.ok { background: var(--good-bg); color: var(--good); }
.err { background: var(--warm); color: var(--warm-ink); }
.muted { color: var(--muted); font-size: 15px; }
</style>
</head>
<body>
<main>
  <h1>Nest invite request</h1>
  <p class="muted" id="lead">Checking the link…</p>
  <div class="card" id="who" hidden>
    <dl id="facts"></dl>
    <div class="row" id="buttons">
      <button class="yes" id="approve" type="button">Approve and send invite</button>
      <button class="no" id="decline" type="button">Decline</button>
    </div>
    <p class="muted">Approve emails them the install steps. Decline sends nothing.</p>
  </div>
  <p class="note" id="msg" hidden role="status"></p>
</main>
<script>
(function () {
  var FN = 'https://tjdyxmechwstuthessgf.supabase.co/functions/v1/beta/';
  var q = new URLSearchParams(location.search);
  var id = q.get('id'), t = q.get('t');
  // Take the token out of the address bar so it isn't left in the browser history.
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  var lead = document.getElementById('lead'), who = document.getElementById('who'), msg = document.getElementById('msg');
  var facts = document.getElementById('facts');
  function say(text, good) { msg.hidden = false; msg.className = 'note ' + (good ? 'ok' : 'err'); msg.textContent = text; }
  function call(door, extra) {
    return fetch(FN + door, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ id: id, t: t }, extra || {})) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'Something went wrong'); return j; }); });
  }
  function add(label, value) {
    if (value == null || value === '' || (Array.isArray(value) && !value.length)) return;
    var dt = document.createElement('dt'); dt.textContent = label;
    var dd = document.createElement('dd'); dd.textContent = Array.isArray(value) ? value.join(', ') : value;
    facts.appendChild(dt); facts.appendChild(dd);
  }
  var STATUS = { invited: 'Already invited', joined: 'Already in Nest', declined: 'Declined (you can still approve)' };
  var approveBtn = document.getElementById('approve'), declineBtn = document.getElementById('decline');
  if (!id || !t) { lead.textContent = 'This page opens from the link in your invite-request email.'; return; }
  call('peek').then(function (s) {
    lead.textContent = s.first_name + ' asked for an invite' + (STATUS[s.status] ? ' · ' + STATUS[s.status] : '') + '.';
    add('Name', s.first_name); add('Email', s.email); add('Mobile', s.mobile); add('Phone', s.phone_type);
    if (s.invited_by) add('Invited by', s.invited_by + (s.auto_approved ? ' (approved automatically)' : ''));
    add("Children's ages", s.child_ages); add('Town', s.town); add('Heard about Nest', s.heard_from); add('Link tag', s.source);
    add('Asked', new Date(s.created_at).toLocaleString('en-ZA', { dateStyle: 'medium', timeStyle: 'short' }));
    who.hidden = false;
    if (s.status === 'joined') document.getElementById('buttons').hidden = true;
    if (s.status === 'invited') {
      // Not set up yet: the invite can still be cancelled.
      approveBtn.hidden = true; declineBtn.textContent = 'Cancel their invite';
      document.querySelector('#who .muted').textContent = 'Cancelling stops them setting up a family in Nest. Nothing is sent to them.';
    }
  }).catch(function (e) { lead.textContent = e.message; });
  function decide(d, btn) {
    var label = btn.textContent;
    approveBtn.disabled = true; declineBtn.disabled = true;
    btn.textContent = d === 'approve' ? 'Sending…' : 'Saving…';
    call('decide', { decision: d }).then(function (r) {
      document.getElementById('buttons').hidden = true;
      say(r.status === 'invited' ? 'Invite sent. They have the install steps in their email.' :
          r.status === 'joined' ? 'They have already set up their family in Nest, so the invite can\'t be cancelled.' :
          'Done. Nothing was sent to them, and they can\'t set up a family in Nest.', true);
    }).catch(function (e) {
      approveBtn.disabled = false; declineBtn.disabled = false;
      btn.textContent = label;
      say(e.message, false);
    });
  }
  document.getElementById('approve').addEventListener('click', function () { decide('approve', this); });
  document.getElementById('decline').addEventListener('click', function () { decide('decline', this); });
})();
</script>
</body>
</html>
